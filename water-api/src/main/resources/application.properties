spring.application.name=water-api

#app.home is set in WaterApiApplication.main to the water-api dir, "." is the fallback when main is skipped (tests)
spring.datasource.url=jdbc:sqlite:${app.home:.}/data/water.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#Browser origins allowed to call the API (the Vite dev server answers on both names)
app.cors.allowed-origins=http://127.0.0.1:3000,http://localhost:3000

#Requests per minute per client IP. /api/address calls the Census geocoder, which publishes no limits, so it stays strict
#Turn off for load tests (one test machine = one IP)
app.rate-limit.enabled=true
app.rate-limit.address-per-minute=5
app.rate-limit.default-per-minute=120

app.data.load-on-startup=true
app.data.force-refresh=false
app.data.max-age-days=14

app.sabl.url=https://gispublic.waterboards.ca.gov/portalserver/rest/services/Drinking_Water/California_Drinking_Water_System_Area_Boundaries/FeatureServer/0/query
app.ces.url=https://services1.arcgis.com/PCHfdHz4GlDNAhBb/arcgis/rest/services/CES5_Draft/FeatureServer/0/query
app.epa.url=https://data.epa.gov/efservice
app.census.url=https://geocoding.geo.census.gov/geocoder
